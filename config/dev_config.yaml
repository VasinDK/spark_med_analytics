s3:
  storage: "https://storage.yandexcloud.net"
  bronze: &bronze_bucket "spark-medanalytics-dev-bronze"
  silver: &silver_bucket "spark-medanalytics-dev-silver"
  gold: &gold_bucket "spark-medanalytics-dev-gold"
  visits_json: 
    bucket: *bronze_bucket
    path: "visits/"
  visits_archive:
    bucket: *bronze_bucket
    path: "archive/visits/"
  departments_csv: 
    bucket: *bronze_bucket
    path: "departments.csv"
  professions_csv: 
    bucket: *bronze_bucket
    path: "professions.csv"
  silver_warehouse: 
    bucket: *silver_bucket
    path: "warehouse/"
  gold_warehouse: 
    bucket: *gold_bucket
    path: "warehouse/"
  quarantine_path: 
    bucket: *silver_bucket
    path: "quarantine/"
  
dq_rule:
  min_age: 0
  max_age: 120
  min_temp: 34.0
  max_temp: 43.0
  percent_marriage: 5.0

log_level:
  py4j: 40
  spark_sql: "WARN"

infrastructure:
  cluster_name: "sparkmedanalytics-cluster"
  code_bucket: "scripts-spark-med"
  whl_file: "sparkmedanalytics-0.1.0-py3-none-any.whl"
  dependencies: "dependencies.zip"
  schemas: "schemas.yaml"
  metrics_path: "metrics"

scripts:
  load_ref_data: "load_ref_data.py"
  process_visits: "process_visits.py"
  schema_sync_ice: "schema_sync_ice.py"
  bronze_to_silver: "bronze_to_silver.py"
  silver_to_gold: "silver_to_gold.py"

dataproc:
  zone: "ru-central1-a"
  subnet_id: "e9b1234567890abcdefg"
  service_account_id: "aje1234567890abcdefg"
  master_cores: 4
  master_memory: 16
  worker_cores: 8
  worker_memory: 32
  worker_count: 3
  disk_size_master: 40
  disk_size_worker: 40
  disk_type_id_master: "network-ssd"
  disk_type_id_worker: "network-ssd"

airflow:
  url: "http://84.201.128.45:8080"
  yc_conn_id: yandex_cloud_default
  aws_conn_id: "yandex_cloud_s3"
  sensor:
    poke_interval: 10
    timeout: 5
    mode: "poke"
    soft_fail: true

packages: >
  org.apache.iceberg:iceberg-spark-runtime-3.3_2.12:1.4.3,
  org.apache.iceberg:iceberg-aws-bundle:1.4.3

repositories: "https://maven.org"