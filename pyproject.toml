[project]
name = "sparkmedanalytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.8"
dependencies = [
    "python-dotenv>=1.0.0",
    "pyspark==3.3.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "black>=24.0,<24.10.0",
    "pytest==7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
